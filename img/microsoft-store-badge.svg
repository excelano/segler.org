<svg xmlns="http://www.w3.org/2000/svg" width="119.66407" height="40" viewBox="0 0 119.66407 40" role="img" aria-label="Get it from Microsoft">
  <title>Get it from Microsoft</title>
  <rect x="0.5" y="0.5" width="118.66407" height="39" rx="6" ry="6" fill="#000000" stroke="#a6a6a6" stroke-width="1"/>
  <!-- Microsoft four-square logo -->
  <g>
    <rect x="12" y="11.5" width="7.6" height="7.6" fill="#f25022"/>
    <rect x="20.4" y="11.5" width="7.6" height="7.6" fill="#7fba00"/>
    <rect x="12" y="19.9" width="7.6" height="7.6" fill="#00a4ef"/>
    <rect x="20.4" y="19.9" width="7.6" height="7.6" fill="#ffb900"/>
  </g>
  <!-- Text lock-up -->
  <text x="35" y="17.2" fill="#ffffff" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="6.4" letter-spacing="0.3">GET IT FROM</text>
  <text x="34.4" y="30.4" fill="#ffffff" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.6" font-weight="400">Microsoft</text>
